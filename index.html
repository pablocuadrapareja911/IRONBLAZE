<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Política de seguridad: solo se ejecuta código de la propia app y de Google/Firebase; nada de scripts en línea -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://static.exercisedb.dev https://raw.githubusercontent.com https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://ironblaze.firebaseapp.com https://*.googleusercontent.com https://static.exercisedb.dev https://raw.githubusercontent.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://ironblaze.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>IRONBLAZE</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <div id="splash"><div class="sp-logo">🔥</div><div class="sp-brand">IRON<b>BLAZE</b></div><div class="sp-bar"><i></i></div></div>
    <main id="view"></main>
    <div id="mini-workout" class="mini-workout hidden"></div>
    <nav id="tabbar" class="tabbar">
      <button data-tab="home" class="tab active">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Inicio</span>
      </button>
      <button data-tab="workout" class="tab">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
        <span>Entrenar</span>
      </button>
      <button data-tab="exercises" class="tab">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <span>Ejercicios</span>
      </button>
      <button data-tab="profile" class="tab">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <span>Perfil</span>
      </button>
    </nav>
    <div id="layers"></div>
    <div id="rest-timer" class="rest-timer hidden"></div>
    <div id="toast" class="toast"></div>
  </div>

  <!-- Filtro de enfoque para las animaciones (son de 180px) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="sharpen"><feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix="0 -0.6 0 -0.6 3.4 -0.6 0 -0.6 0"/></filter>
  </svg>
  <script src="js/exercises-data.js"></script>
  <script src="js/hd-images.js"></script>
  <script src="js/es-content.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/bodymap.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
